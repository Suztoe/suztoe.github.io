<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fa">
  <title>FRAME — 画像デザインスタジオ</title>
  <link rel="stylesheet" href="styles.css">

</head>
<body>
  <div class="app">
    <header><div class="brand"><i class="mark"></i>frame</div><div class="header-actions"><span class="saved">自動保存済み</span><button class="btn" id="reset">リセット</button><button class="btn primary" id="download">書き出す&nbsp;↗</button></div></header>
    <aside class="sidebar"><p class="eyebrow">編集</p><label class="tool active" for="file-input"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-4.5-4.5L8 19"/></svg><span>画像を追加</span></label><input id="file-input" class="file" type="file" accept="image/*,.heic,.heif"><button class="tool" id="rotate"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.7-3.9L3 10"/><path d="M3 5v5h5"/><path d="M4 13a8 8 0 0 0 14.7 3.9L21 14"/><path d="M21 19v-5h-5"/></svg><span>回転</span></button><button class="tool" id="flip"><svg viewBox="0 0 24 24"><path d="M12 4v16M5 7h5v10H5zM14 7h5v10h-5z"/></svg><span>反転</span></button><button class="tool" id="grayscale"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/></svg><span>モノクロ</span></button><div class="rule"></div><p class="eyebrow">最近使った画像</p><div class="recent"><figure><figcaption>sunset</figcaption></figure><figure><figcaption>coastal</figcaption></figure><figure><figcaption>deep blue</figcaption></figure><figure><figcaption>portrait</figcaption></figure></div></aside>
    <main><div class="canvas-head"><div class="canvas-title">編集キャンバス <small>4 : 3</small></div><div class="zoom-bar"><button class="icon" id="zoom-out" aria-label="縮小"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><span class="zoom" id="zoom-label">100%</span><button class="icon" id="zoom-in" aria-label="拡大"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></div><div class="quick-actions"><label class="quick-action" for="file-input"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>画像を追加</label><button id="quick-text"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M8 19h8"/></svg>テキスト</button><button id="quick-rotate"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.7-3.9L3 10"/><path d="M3 5v5h5"/></svg>回転</button><button id="quick-flip"><svg viewBox="0 0 24 24"><path d="M12 4v16M5 7h5v10H5zM14 7h5v10h-5z"/></svg>反転</button><button id="quick-adjust"><svg viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></svg>調整</button></div><div class="stage-area"><div class="stage" id="stage"><canvas id="canvas" width="1200" height="900"></canvas><div class="drop"></div><div class="empty" id="empty"><div class="empty-card"><div class="empty-icon"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 16.5 8.5 12l3 3 4-5 4.5 6.5"/><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1"/></svg></div><h2>画像をアップロードして編集を開始</h2><p>ドラッグ＆ドロップ、またはデバイスから追加できます</p><label class="add" for="file-input">＋ 画像を選択</label></div></div></div></div></main>
    <aside class="panel"><h1>画像を調整</h1><section class="section"><h2>フィルター</h2><div class="filters"><button class="filter selected" data-filter="none"><div class="preview"></div>オリジナル</button><button class="filter" data-filter="grayscale(1)"><div class="preview"></div>モノクロ</button><button class="filter" data-filter="sepia(.25)"><div class="preview"></div>ウォーム</button><button class="filter" data-filter="saturate(1.35)"><div class="preview"></div>ビビッド</button><button class="filter" data-filter="contrast(1.15)"><div class="preview"></div>コントラスト</button><button class="filter" data-filter="brightness(1.2)"><div class="preview"></div>ライト</button></div></section><section class="section text-controls"><h2>テキスト</h2><textarea id="text-input" rows="3" placeholder="ここに入力"></textarea><button class="btn" id="add-text">＋ テキストを追加</button><div class="slider-row"><label>サイズ</label><input id="text-size" type="range" min="18" max="120" value="48"><output id="text-size-out">48px</output></div><label class="color-label">カラー <input id="text-color" type="color" value="#ffffff"></label><button class="text-delete" id="delete-text" disabled>選択中のテキストを削除</button></section><section class="section"><h2>微調整</h2><div class="slider-row"><label>明るさ</label><input id="brightness" type="range" min="50" max="150" value="100"><output id="brightness-out">100%</output></div><div class="slider-row"><label>コントラスト</label><input id="contrast" type="range" min="50" max="150" value="100"><output id="contrast-out">100%</output></div><div class="slider-row"><label>彩度</label><input id="saturation" type="range" min="0" max="200" value="100"><output id="saturation-out">100%</output></div></section><section class="section"><h2>キャンバス比率</h2><div class="ratio"><button class="active" data-ratio="4/3">4 : 3</button><button data-ratio="1/1">1 : 1</button><button data-ratio="16/9">16 : 9</button><button data-ratio="9/16">9 : 16</button></div></section><section class="section"><h2>保存形式</h2><div class="format"><button class="active" data-format="png">PNG</button><button data-format="jpeg">JPG</button><button data-format="webp">WebP</button></div></section></aside>
  </div>
  <nav class="mobile-tools"><label for="file-input"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>追加</span></label><button id="mobile-text"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M8 19h8"/></svg><span>テキスト</span></button><button id="mobile-template"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg><span>テンプレート</span></button><button id="mobile-rotate"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.7-3.9L3 10"/><path d="M3 5v5h5"/></svg><span>回転</span></button><button id="mobile-adjust"><svg viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></svg><span>調整</span></button><button id="mobile-download"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 20h14"/></svg><span>保存</span></button></nav>
  <script src="script.js" defer></script>

</body>
</html>
