<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fa">
  <title>FRAME — 画像デザインスタジオ</title>
  <style>
    :root{--bg:#f5f6fa;--paper:#fff;--ink:#20222a;--sub:#858995;--line:#e8e9ef;--purple:#665cf2;--soft:#f0efff;--shadow:0 24px 70px #22253c12}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
    button,input{font:inherit}button{cursor:pointer;border:0;color:inherit;-webkit-tap-highlight-color:transparent}
    .app{min-height:100dvh;display:grid;grid-template-columns:250px minmax(0,1fr) 310px;grid-template-rows:68px}
    header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:#fffffff0;border-bottom:1px solid var(--line);backdrop-filter:blur(18px);z-index:2}
    .brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.06em}.mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#9188ff,#5249db);box-shadow:0 7px 16px #665cf244;position:relative}.mark:before{content:"";position:absolute;inset:8px;border:2px solid #fff;border-radius:4px}.mark:after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;left:12px;top:12px}
    .header-actions,.file-actions{display:flex;align-items:center;gap:9px}.saved{font-size:12px;color:var(--sub);margin-right:12px}.btn{height:38px;padding:0 15px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700;white-space:nowrap}.btn:hover{border-color:#c9cad4}.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 8px 18px #665cf233}
    .sidebar{background:#fff;border-right:1px solid var(--line);padding:25px 14px}.eyebrow{font-size:10px;color:var(--sub);letter-spacing:.14em;font-weight:800;margin:0 11px 10px}.tool{width:100%;display:flex;align-items:center;gap:13px;padding:12px 11px;margin:2px 0;background:transparent;border-radius:9px;text-align:left;color:#626672}.tool:hover,.tool.active{color:var(--purple);background:var(--soft)}.tool svg,.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.rule{height:1px;background:var(--line);margin:22px 10px}.recent{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px}.recent figure{height:65px;border-radius:9px;margin:0;overflow:hidden;position:relative;background:linear-gradient(140deg,#f7c3b4,#947ad3 55%,#292d5b)}.recent figure:nth-child(2){background:linear-gradient(140deg,#fae7c9,#ee987e 52%,#5b6e92)}.recent figure:nth-child(3){background:linear-gradient(140deg,#cce7df,#507985 52%,#253047)}.recent figure:nth-child(4){background:linear-gradient(140deg,#f6d0df,#af73ae 50%,#40386d)}.recent figcaption{position:absolute;left:7px;bottom:5px;color:#fff;font-size:9px;text-shadow:0 1px 5px #0008}
    main{min-width:0;display:flex;flex-direction:column}.canvas-head{height:62px;padding:0 28px;display:flex;align-items:center;justify-content:space-between}.canvas-title{font-weight:750}.canvas-title small{font-weight:500;color:var(--sub);margin-left:10px}.zoom-bar{display:flex;align-items:center;color:var(--sub)}.icon{width:36px;height:36px;display:grid;place-items:center;background:transparent;border-radius:9px}.icon:hover{background:#fff;color:var(--ink)}.zoom{width:57px;text-align:center;font-size:12px;font-weight:700;color:#555966}
    .stage-area{flex:1;display:grid;place-items:center;padding:18px 30px 48px;overflow:auto}.stage{width:min(780px,84vw);aspect-ratio:4/3;position:relative;display:grid;place-items:center;overflow:hidden;background-image:linear-gradient(45deg,#e7e8ed 25%,transparent 25%),linear-gradient(-45deg,#e7e8ed 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e7e8ed 75%),linear-gradient(-45deg,transparent 75%,#e7e8ed 75%);background-size:26px 26px;background-position:0 0,0 13px,13px -13px,-13px 0;box-shadow:var(--shadow);transition:transform .2s;touch-action:none}.stage canvas{display:block;width:100%;height:100%;object-fit:contain}.drop{position:absolute;inset:18px;border:2px dashed transparent;border-radius:10px;pointer-events:none}.stage.dragging .drop{border-color:var(--purple);background:#665cf20b}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center}.empty-card{width:290px;padding:27px 20px;border:1px dashed #c9cbd4;border-radius:16px;background:#fffffff2;pointer-events:auto}.empty-card .add{display:inline-flex;align-items:center;gap:7px;margin-top:16px;height:35px;padding:0 13px;border:1px solid #dcdde5;border-radius:8px;background:#fff;color:var(--purple);font-weight:750}.empty-icon{width:44px;height:44px;display:grid;place-items:center;margin:0 auto 12px;border-radius:13px;color:var(--purple);background:var(--soft)}.empty h2{font-size:16px;margin:0 0 4px}.empty p{font-size:12px;color:var(--sub);margin:0}.text-layer{position:absolute;z-index:2;max-width:90%;padding:3px 7px;color:#fff;font-family:"Noto Sans JP","Noto Sans",sans-serif;font-weight:700;line-height:1.15;text-align:center;white-space:pre-wrap;cursor:move;user-select:none;text-shadow:0 2px 8px #0008;transform:translate(-50%,-50%)}.text-layer.selected{outline:2px solid var(--purple);outline-offset:5px}.quick-actions{display:flex;align-items:center;gap:8px;padding:0 28px 8px}.quick-actions button,.quick-actions .quick-action{display:flex;align-items:center;gap:7px;height:34px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#666a75;font-size:11px;font-weight:700}.quick-actions button:hover,.quick-actions .quick-action:hover{border-color:#c9cad4;color:var(--purple);background:var(--soft)}.quick-actions svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .panel{background:#fff;border-left:1px solid var(--line);padding:25px 20px;overflow:auto}.panel h1{font-size:17px;margin:0 0 23px;letter-spacing:-.03em}.section{padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line)}.section:last-child{border:0}.section>h2{font-size:11px;color:var(--sub);letter-spacing:.12em;margin:0 0 13px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.filter{padding:5px;border:1px solid var(--line);border-radius:9px;background:#fafafa;color:#777b85;font-size:10px}.filter:hover,.filter.selected{color:var(--purple);border-color:var(--purple);box-shadow:0 0 0 2px var(--soft)}.preview{height:43px;border-radius:5px;margin-bottom:5px;background:linear-gradient(135deg,#f0baac,#7a70ba)}.filters .filter:nth-child(2) .preview{filter:grayscale(1)}.filters .filter:nth-child(3) .preview{filter:sepia(.75)}.filters .filter:nth-child(4) .preview{filter:saturate(1.8)}.filters .filter:nth-child(5) .preview{filter:contrast(1.45)}.filters .filter:nth-child(6) .preview{filter:brightness(1.2)}.text-controls .btn{width:100%;height:34px;color:var(--purple);background:var(--soft)}.color-label{display:flex;align-items:center;justify-content:space-between;margin:13px 0;font-size:12px;color:#666a75}.color-label input{width:42px;height:28px;padding:2px;border:1px solid var(--line);border-radius:7px;background:#fff}.text-delete{width:100%;padding:8px;border-radius:8px;background:#f8f8fa;color:var(--sub);font-size:11px}.text-delete:disabled{cursor:not-allowed;opacity:.55}
    .slider-row{display:grid;grid-template-columns:72px 1fr 40px;gap:9px;align-items:center;margin:14px 0}.slider-row label{font-size:12px;color:#666a75}input[type=range]{width:100%;accent-color:var(--purple)}output{text-align:right;color:#4e5260;font-size:12px;font-variant-numeric:tabular-nums}.ratio{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.ratio button{height:35px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--sub);font-size:11px;font-weight:700}.ratio button.active{border-color:var(--purple);color:var(--purple);background:var(--soft)}.format{display:flex;gap:8px}.format button{flex:1;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--sub);font-weight:750}.format button.active{border-color:var(--purple);background:var(--soft);color:var(--purple)}
    .file{display:none}.mobile-tools{display:none}.template-tool{margin-top:6px}.modal{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:22px;background:#20222a66;backdrop-filter:blur(8px)}.modal.open{display:grid}.modal-card{width:min(760px,100%);max-height:min(720px,90dvh);overflow:auto;padding:25px;border-radius:20px;background:#fff;box-shadow:0 25px 80px #20222a33}.modal-head{display:flex;align-items:start;justify-content:space-between;margin-bottom:20px}.modal-head h2{margin:0;font-size:20px;letter-spacing:-.04em}.modal-head p{margin:5px 0 0;color:var(--sub);font-size:12px}.close{width:34px;height:34px;border-radius:9px;background:#f5f6fa;color:var(--sub);font-size:20px}.template-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.template-card{padding:0;border:1px solid var(--line);border-radius:13px;background:#fff;overflow:hidden;text-align:left;transition:.15s}.template-card:hover{border-color:var(--purple);transform:translateY(-2px);box-shadow:0 8px 18px #665cf21c}.template-preview{height:120px;position:relative;overflow:hidden}.template-preview:after{content:"";position:absolute;inset:18px;border:1px solid #ffffff88;border-radius:8px}.template-preview span{position:absolute;z-index:1;left:18px;bottom:20px;color:#fff;font-size:17px;font-weight:800;letter-spacing:-.05em}.template-card:nth-child(1) .template-preview{background:linear-gradient(135deg,#f49c78,#a35c9c 58%,#252c68)}.template-card:nth-child(2) .template-preview{background:linear-gradient(135deg,#142b4a,#4a8da2 55%,#f2c07d)}.template-card:nth-child(3) .template-preview{background:linear-gradient(135deg,#f4d6c8,#e28ba0 52%,#6d4e9b)}.template-card:nth-child(4) .template-preview{background:linear-gradient(135deg,#e8f2ee,#75a99e 50%,#305b62)}.template-card:nth-child(5) .template-preview{background:linear-gradient(135deg,#252735,#6d69b4 55%,#d2a4c5)}.template-card:nth-child(6) .template-preview{background:linear-gradient(135deg,#f8e9be,#efb06d 50%,#df6b5a)}.template-info{padding:11px 12px}.template-info strong{display:block;font-size:12px}.template-info small{display:block;margin-top:3px;color:var(--sub);font-size:10px}
    @media(max-width:1050px){.app{grid-template-columns:76px minmax(0,1fr);grid-template-rows:62px}.sidebar{padding:20px 10px}.tool{justify-content:center}.tool span,.eyebrow,.rule,.recent{display:none}.panel{display:none}.saved{display:none}.stage{width:min(780px,86vw)}}
    @media(max-width:640px){header{padding:0 14px}.app{grid-template-rows:58px 1fr}.brand{font-size:18px}.header-actions{gap:6px}.header-actions .btn:first-of-type{display:none}.btn{height:35px;padding:0 10px;font-size:12px}.sidebar{display:none}.canvas-head{height:52px;padding:0 14px}.quick-actions{display:none}.stage-area{padding:10px 12px 92px;align-items:start}.stage{width:100%;margin-top:8px;aspect-ratio:1/1;max-height:calc(100dvh - 190px)}.mobile-tools{position:fixed;display:flex;z-index:5;bottom:0;left:0;right:0;height:70px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;background:#fffffff2;border-top:1px solid var(--line);backdrop-filter:blur(16px)}.mobile-tools button,.mobile-tools label{display:grid;place-items:center;gap:2px;background:transparent;color:#686c77;font-size:10px}.mobile-tools label{color:var(--purple)}.mobile-tools svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.empty-card{width:245px;padding:22px 14px}.empty-card h2{font-size:14px}}
    @media(max-width:640px){.modal{padding:12px}.modal-card{padding:18px;border-radius:16px}.template-grid{grid-template-columns:repeat(2,1fr);gap:8px}.template-preview{height:92px}.template-preview span{left:12px;bottom:14px;font-size:13px}.template-info{padding:9px}.template-info strong{font-size:11px}}
  </style>
</head>
<body>
  <div class="app">
    <header><div class="brand"><i class="mark"></i>frame</div><div class="header-actions"><span class="saved">自動保存済み</span><button class="btn" id="reset">リセット</button><button class="btn primary" id="download">書き出す&nbsp;↗</button></div></header>
    <aside class="sidebar"><p class="eyebrow">編集</p><label class="tool active" for="file-input"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-4.5-4.5L8 19"/></svg><span>画像を追加</span></label><input id="file-input" class="file" type="file" accept="image/*"><button class="tool" id="rotate"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.7-3.9L3 10"/><path d="M3 5v5h5"/><path d="M4 13a8 8 0 0 0 14.7 3.9L21 14"/><path d="M21 19v-5h-5"/></svg><span>回転</span></button><button class="tool" id="flip"><svg viewBox="0 0 24 24"><path d="M12 4v16M5 7h5v10H5zM14 7h5v10h-5z"/></svg><span>反転</span></button><button class="tool" id="grayscale"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/></svg><span>モノクロ</span></button><div class="rule"></div><p class="eyebrow">最近使った画像</p><div class="recent"><figure><figcaption>sunset</figcaption></figure><figure><figcaption>coastal</figcaption></figure><figure><figcaption>deep blue</figcaption></figure><figure><figcaption>portrait</figcaption></figure></div></aside>
    <main><div class="canvas-head"><div class="canvas-title">編集キャンバス <small>4 : 3</small></div><div class="zoom-bar"><button class="icon" id="zoom-out" aria-label="縮小"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><span class="zoom" id="zoom-label">100%</span><button class="icon" id="zoom-in" aria-label="拡大"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></div><div class="quick-actions"><label class="quick-action" for="file-input"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>画像を追加</label><button id="quick-text"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M8 19h8"/></svg>テキスト</button><button id="quick-rotate"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.7-3.9L3 10"/><path d="M3 5v5h5"/></svg>回転</button><button id="quick-flip"><svg viewBox="0 0 24 24"><path d="M12 4v16M5 7h5v10H5zM14 7h5v10h-5z"/></svg>反転</button><button id="quick-adjust"><svg viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></svg>調整</button></div><div class="stage-area"><div class="stage" id="stage"><canvas id="canvas" width="1200" height="900"></canvas><div class="drop"></div><div class="empty" id="empty"><div class="empty-card"><div class="empty-icon"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 16.5 8.5 12l3 3 4-5 4.5 6.5"/><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1"/></svg></div><h2>画像をアップロードして編集を開始</h2><p>ドラッグ＆ドロップ、またはデバイスから追加できます</p><label class="add" for="file-input">＋ 画像を選択</label></div></div></div></div></main>
    <aside class="panel"><h1>画像を調整</h1><section class="section"><h2>フィルター</h2><div class="filters"><button class="filter selected" data-filter="none"><div class="preview"></div>オリジナル</button><button class="filter" data-filter="grayscale(1)"><div class="preview"></div>モノクロ</button><button class="filter" data-filter="sepia(.75)"><div class="preview"></div>ウォーム</button><button class="filter" data-filter="saturate(1.8)"><div class="preview"></div>ビビッド</button><button class="filter" data-filter="contrast(1.45)"><div class="preview"></div>コントラスト</button><button class="filter" data-filter="brightness(1.2)"><div class="preview"></div>ライト</button></div></section><section class="section text-controls"><h2>テキスト</h2><button class="btn" id="add-text">＋ テキストを追加</button><div class="slider-row"><label>サイズ</label><input id="text-size" type="range" min="18" max="120" value="48"><output id="text-size-out">48px</output></div><label class="color-label">カラー <input id="text-color" type="color" value="#ffffff"></label><button class="text-delete" id="delete-text" disabled>選択中のテキストを削除</button></section><section class="section"><h2>微調整</h2><div class="slider-row"><label>明るさ</label><input id="brightness" type="range" min="50" max="150" value="100"><output id="brightness-out">100%</output></div><div class="slider-row"><label>コントラスト</label><input id="contrast" type="range" min="50" max="150" value="100"><output id="contrast-out">100%</output></div><div class="slider-row"><label>彩度</label><input id="saturation" type="range" min="0" max="200" value="100"><output id="saturation-out">100%</output></div></section><section class="section"><h2>キャンバス比率</h2><div class="ratio"><button class="active" data-ratio="4/3">4 : 3</button><button data-ratio="1/1">1 : 1</button><button data-ratio="16/9">16 : 9</button><button data-ratio="9/16">9 : 16</button></div></section><section class="section"><h2>保存形式</h2><div class="format"><button class="active" data-format="png">PNG</button><button data-format="jpeg">JPG</button></div></section></aside>
  </div>
  <nav class="mobile-tools"><label for="file-input"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>追加</span></label><button id="mobile-text"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M8 19h8"/></svg><span>テキスト</span></button><button id="mobile-template"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg><span>テンプレート</span></button><button id="mobile-rotate"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.7-3.9L3 10"/><path d="M3 5v5h5"/></svg><span>回転</span></button><button id="mobile-adjust"><svg viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></svg><span>調整</span></button><button id="mobile-download"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 20h14"/></svg><span>保存</span></button></nav>
  <script>
    const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),canvas=$("#canvas"),ctx=canvas.getContext("2d"),stage=$("#stage"),empty=$("#empty");let image=null,rotation=0,flipped=false,zoom=100,chosenFilter="none",format="png",template=null,selectedTextId=null;const textLayers=[],values={brightness:100,contrast:100,saturation:100};const templateColors={sunset:["#f49c78","#252c68"],travel:["#142b4a","#f2c07d"],beauty:["#f4d6c8","#6d4e9b"],nature:["#e8f2ee","#305b62"],night:["#252735","#d2a4c5"],sale:["#f8e9be","#df6b5a"]};
    function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();if(template){const colors=templateColors[template],gradient=ctx.createLinearGradient(0,0,canvas.width,canvas.height);gradient.addColorStop(0,colors[0]);gradient.addColorStop(1,colors[1]);ctx.fillStyle=gradient;ctx.fillRect(0,0,canvas.width,canvas.height)}if(image){ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(rotation*Math.PI/180);ctx.scale(flipped?-1:1,1);const scale=Math.max(canvas.width/image.width,canvas.height/image.height);const adjustments=`brightness(${values.brightness}%) contrast(${values.contrast}%) saturate(${values.saturation}%)`;ctx.filter=chosenFilter==="none"?adjustments:`${chosenFilter} ${adjustments}`;ctx.globalAlpha=template?.7:1;ctx.drawImage(image,-image.width*scale/2,-image.height*scale/2,image.width*scale,image.height*scale)}ctx.restore();renderTextLayers()}
    function renderTextLayers(){stage.querySelectorAll(".text-layer").forEach(node=>node.remove());textLayers.forEach(layer=>{const node=document.createElement("div");node.className=`text-layer${layer.id===selectedTextId?" selected":""}`;node.dataset.id=layer.id;node.textContent=layer.text;node.style.left=`${layer.x/canvas.width*100}%`;node.style.top=`${layer.y/canvas.height*100}%`;node.style.fontSize=`${layer.size/canvas.width*100}%`;node.style.color=layer.color;node.addEventListener("pointerdown",startTextDrag);node.addEventListener("click",()=>selectText(layer.id));node.addEventListener("dblclick",()=>editText(layer.id));stage.append(node)})}
    function addText(){const text=prompt("キャンバスに入れるテキストを入力してください");if(!text)return;const layer={id:Date.now().toString(),text,x:canvas.width/2,y:canvas.height/2,size:Number($("#text-size").value),color:$("#text-color").value};textLayers.push(layer);selectText(layer.id)}
    function selectText(id){selectedTextId=id;const layer=textLayers.find(item=>item.id===id);if(layer){$("#text-size").value=layer.size;$("#text-size-out").textContent=`${layer.size}px`;$("#text-color").value=layer.color}$("#delete-text").disabled=!layer;renderTextLayers()}
    function editText(id){const layer=textLayers.find(item=>item.id===id),text=layer&&prompt("テキストを編集",layer.text);if(layer&&text){layer.text=text;draw()}}
    function startTextDrag(event){event.preventDefault();const id=event.currentTarget.dataset.id;selectText(id);const layer=textLayers.find(item=>item.id===id),rect=stage.getBoundingClientRect();const move=moveEvent=>{if(!layer)return;layer.x=Math.max(0,Math.min(canvas.width,(moveEvent.clientX-rect.left)/rect.width*canvas.width));layer.y=Math.max(0,Math.min(canvas.height,(moveEvent.clientY-rect.top)/rect.height*canvas.height));renderTextLayers()};const stop=()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",stop)};window.addEventListener("pointermove",move);window.addEventListener("pointerup",stop)}
    function drawTextOnCanvas(){ctx.save();ctx.textAlign="center";ctx.textBaseline="middle";textLayers.forEach(layer=>{ctx.font=`700 ${layer.size}px "Noto Sans JP","Noto Sans",sans-serif`;ctx.fillStyle=layer.color;ctx.shadowColor="#0008";ctx.shadowBlur=8;ctx.fillText(layer.text,layer.x,layer.y)});ctx.restore()}
    function load(file){if(!file||!file.type.startsWith("image/"))return;const reader=new FileReader();reader.onload=()=>{image=new Image();image.onload=()=>{empty.style.display="none";draw()};image.src=reader.result};reader.readAsDataURL(file)}
    $("#file-input").addEventListener("change",e=>load(e.target.files[0]));["dragover","dragenter"].forEach(e=>stage.addEventListener(e,x=>{x.preventDefault();stage.classList.add("dragging")}));["dragleave","drop"].forEach(e=>stage.addEventListener(e,x=>{x.preventDefault();stage.classList.remove("dragging")}));stage.addEventListener("drop",e=>load(e.dataTransfer.files[0]));
    const rotate=()=>{rotation=(rotation+90)%360;draw()};$("#rotate").addEventListener("click",rotate);$("#mobile-rotate").addEventListener("click",rotate);$("#quick-rotate").addEventListener("click",rotate);const flip=()=>{flipped=!flipped;draw()};$("#flip").addEventListener("click",flip);$("#quick-flip").addEventListener("click",flip);$("#grayscale").addEventListener("click",()=>{$('[data-filter="grayscale(1)"]').click()});$("#quick-adjust").addEventListener("click",()=>document.querySelector(".panel").scrollIntoView({behavior:"smooth"}));
    $$(".filter").forEach(b=>b.addEventListener("click",()=>{$(".filter.selected").classList.remove("selected");b.classList.add("selected");chosenFilter=b.dataset.filter;draw()}));
    ["brightness","contrast","saturation"].forEach(k=>{const input=$("#"+k),out=$("#"+k+"-out");input.addEventListener("input",()=>{values[k]=input.value;out.textContent=`${input.value}%`;draw()})});
    $$(".ratio button").forEach(b=>b.addEventListener("click",()=>{$(".ratio .active").classList.remove("active");b.classList.add("active");const r=b.dataset.ratio;stage.style.aspectRatio=r;canvas.width=r==="1/1"?1000:r==="16/9"?1600:r==="9/16"?900:1200;canvas.height=r==="1/1"?1000:r==="16/9"?900:r==="9/16"?1600:900;draw()}));
    $$(".format button").forEach(b=>b.addEventListener("click",()=>{$(".format .active").classList.remove("active");b.classList.add("active");format=b.dataset.format}));
    function setZoom(next){zoom=Math.round(Math.max(70,Math.min(150,next)));$("#zoom-label").textContent=`${zoom}%`;stage.style.transform=`scale(${zoom/100})`}$("#zoom-in").addEventListener("click",()=>setZoom(zoom+10));$("#zoom-out").addEventListener("click",()=>setZoom(zoom-10));
    function exportImage(){if(!image&&!template&&!textLayers.length){$("#file-input").click();return}draw();drawTextOnCanvas();const a=document.createElement("a");a.download=`frame-${Date.now()}.${format}`;a.href=canvas.toDataURL(format==="jpeg"?"image/jpeg":"image/png",.92);a.click()}$("#download").addEventListener("click",exportImage);$("#mobile-download").addEventListener("click",exportImage);$("#mobile-adjust").addEventListener("click",()=>alert("画面を横向きにすると、詳細な調整パネルを表示できます。"));
    $("#add-text").addEventListener("click",addText);$("#quick-text").addEventListener("click",addText);$("#mobile-text").addEventListener("click",addText);$("#text-size").addEventListener("input",()=>{const layer=textLayers.find(item=>item.id===selectedTextId);$("#text-size-out").textContent=`${$("#text-size").value}px`;if(layer){layer.size=Number($("#text-size").value);draw()}});$("#text-color").addEventListener("input",()=>{const layer=textLayers.find(item=>item.id===selectedTextId);if(layer){layer.color=$("#text-color").value;draw()}});$("#delete-text").addEventListener("click",()=>{const index=textLayers.findIndex(item=>item.id===selectedTextId);if(index>-1){textLayers.splice(index,1);selectedTextId=null;$("#delete-text").disabled=true;draw()}});
    window.addEventListener("keydown",event=>{if((event.key==="Backspace"||event.key==="Delete")&&selectedTextId&&!["INPUT","TEXTAREA"].includes(document.activeElement.tagName))$("#delete-text").click()});
    $("#reset").addEventListener("click",()=>{image=null;template=null;textLayers.length=0;selectedTextId=null;rotation=0;flipped=false;chosenFilter="none";Object.assign(values,{brightness:100,contrast:100,saturation:100});["brightness","contrast","saturation"].forEach(k=>{$("#"+k).value=100;$("#"+k+"-out").textContent="100%"});$(".filter.selected").classList.remove("selected");$('[data-filter="none"]').classList.add("selected");$("#delete-text").disabled=true;empty.style.display="grid";draw()});
    const templateButton=document.createElement("button");templateButton.className="tool template-tool";templateButton.innerHTML='<span style="font-size:18px">▦</span><span>テンプレート</span>';$(".sidebar").insertBefore(templateButton,$(".sidebar .tool:nth-of-type(2)"));
    const templateModal=document.createElement("div");templateModal.className="modal";templateModal.id="template-modal";templateModal.innerHTML='<div class="modal-card"><div class="modal-head"><div><h2>テンプレートを選ぶ</h2><p>目的に近いデザインから、すぐに始められます。</p></div><button class="close" aria-label="閉じる">×</button></div><div class="template-grid">'+[["sunset","GOOD<br>VIBES","サンセットポスター","イベント / ポスター"],["travel","TRAVEL<br>NOTES","トラベルノート","旅行 / ストーリー"],["beauty","NEW<br>MOOD","ビューティーカバー","美容 / SNS投稿"],["nature","GO<br>OUTSIDE","ネイチャー","ライフスタイル"],["night","AFTER<br>DARK","ナイトイベント","音楽 / イベント"],["sale","SALE<br>DAY","セールバナー","ショップ / 告知"]].map(t=>`<button class="template-card" data-template="${t[0]}"><div class="template-preview"><span>${t[1]}</span></div><div class="template-info"><strong>${t[2]}</strong><small>${t[3]}</small></div></button>`).join("")+'</div></div>';document.body.append(templateModal);
    const openTemplateModal=()=>templateModal.classList.add("open");templateButton.addEventListener("click",openTemplateModal);$("#mobile-template").addEventListener("click",openTemplateModal);$(".close",templateModal).addEventListener("click",()=>templateModal.classList.remove("open"));templateModal.addEventListener("click",e=>{if(e.target===templateModal)templateModal.classList.remove("open")});$$(".template-card").forEach(b=>b.addEventListener("click",()=>{template=b.dataset.template;empty.style.display="none";templateModal.classList.remove("open");draw()}));
    let startDistance=0,startZoom=zoom;stage.addEventListener("touchstart",e=>{if(e.touches.length===2){startDistance=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);startZoom=zoom}},{passive:true});stage.addEventListener("touchmove",e=>{if(e.touches.length===2){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);setZoom(startZoom+(d-startDistance)/3)}},{passive:false});
  </script>
</body>
</html>
